name: Deploy Gallery to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gallery/**', '.github/workflows/gallery-*.yml']

permissions:
  contents: read

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: gallery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: gallery/.nvmrc
          cache: npm
          cache-dependency-path: gallery/package-lock.json
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
