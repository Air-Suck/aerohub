services:
  px4:
    environment:
      PX4_GZ_WORLD: swarm_formation_demo
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    volumes:
      - ${PLANNER_DEMO_DIR:?Set PLANNER_DEMO_DIR to the absolute demo directory}:/demo
      - ${PLANNER_DEMO_DIR:?Set PLANNER_DEMO_DIR to the absolute demo directory}/swarm_formation_demo.sdf:/workspace/PX4-Autopilot/Tools/simulation/gz/worlds/swarm_formation_demo.sdf:ro
  planner:
    volumes:
      - ${PLANNER_DEMO_DIR:?Set PLANNER_DEMO_DIR to the absolute demo directory}:/demo
