schema_version: "1.0"
id: state-estimator.pin-slam-lidar
version: upstream-e2b7fbf-aerohub-0.1.0
type: capability
name: PIN-SLAM LiDAR state estimate
description: Provides canonical AS2 pose and twist by composing PIN-SLAM global correction with high-rate PX4 local odometry.

implementation:
  component_id: pin-slam
  manifest: deployment/pin_slam/component.yaml
  shared_runtime: pin-slam-gpu
  coupled_capabilities:
    - perception.pin-slam-neural-points

inputs:
  - id: lidar_points
    capability_type: sensor/lidar/point-cloud/3d
  - id: local_odometry
    capability_type: state/local/odometry/3d

outputs:
  - id: canonical_pose
    capability_type: state/self/pose/3d
  - id: canonical_twist
    capability_type: state/self/twist/3d

interfaces: []

lifecycle:
  management: shared_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: compute/gpu/cuda
  - hardware_type: sensor/lidar/3d

resource_access:
  reads:
    - sensor/lidar
    - vehicle/local-odometry
  shared_writes:
    - compute/gpu
  exclusive_writes:
    - vehicle/self-state
    - vehicle/tf

demo:
  representations:
    - id: canonical_pose
      stage: final
      description: Canonical vehicle pose after PIN-SLAM global correction and PX4 local-state composition.
      interface: {protocol: ros2_topic, schema: geometry_msgs/msg/PoseStamped}
      renderer: pose_3d
