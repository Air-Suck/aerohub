schema_version: 0.1
id: state-estimator.pin-slam-lidar
name: PIN-SLAM LiDAR state estimate
version: upstream-e2b7fbf-aerohub-0.1.0
type: state-estimator
description: Globally corrected LiDAR pose with finite-difference body twist
component:
  id: pin-slam
  manifest: deployment/pin_slam/component.yaml
  shared_process_group: pin-slam-gpu
  coupled_capabilities: [perception.pin-slam-neural-points]
usage:
  mode: continuous-provider
  selection_phase: deployment
  invocation_interface: AS2 state_estimator plugin_name=pin_slam
  switching_constraints:
    - Switch only while motion tasks are stopped and the previous state/TF provider is inactive.
inputs:
  - interface: /<namespace>/sensor_measurements/Lidar/points
    schema: sensor_msgs/msg/PointCloud2 XYZ float32
    frame: <namespace>/Lidar, FLU
    time: AirSim LiDAR sample time in the shared /clock domain
    units: metres
outputs:
  - interface: /<namespace>/self_localization/pose
    schema: geometry_msgs/msg/PoseStamped
    frame: AS2 earth frame
    time: preserved input sample time
  - interface: /<namespace>/self_localization/twist
    schema: geometry_msgs/msg/TwistStamped
    frame: AS2 base frame
    time: preserved input sample time
preconditions:
  - LiDAR frames are monotonic, nonempty, metrically scaled, and match the configured frame.
  - sensor_from_base is valid for the selected vehicle.
  - A shadow accuracy gate has passed before authority is enabled.
resources:
  reads: [drone0.lidar, drone0.clock]
  writes: [drone0.state, drone0.tf]
  conflicts: [other state or TF authority for the same vehicle]
  enforcement: deployment selection plus AS2 plugin ownership; no hot-switch arbiter implemented
lifecycle:
  startup: platform LiDAR before algorithm; algorithm before AS2 plugin selection
  readiness: at least two accepted poses with derived twist and fresh diagnostics
  freshness: plugin rejects samples older than configured max_age and non-monotonic epochs
  feedback: diagnostic_msgs status from the algorithm and AS2 output freshness
  completion: continuous provider; no task completion
  cancel_or_stop: deselect authority, stop plugin host, then stop shared algorithm process
  failure: tracking loss or invalid input suppresses new authoritative samples
  recovery: restart outside active motion; new process means a new local-map epoch
type_specific:
  modality: lidar
  tf: earth/map/odom/base are owned by the selected AS2 State Estimator host
  reset: no seamless reset or map-frame continuity guarantee
  loop_closure: global pose can jump; smooth local odometry is not exposed
validation:
  stage: partial
  gate: deployment/pin_slam/validation.yaml
  scope: Native plugin, real GPU odometry, canonical AS2 output and visible AirSim shadow flight are verified; sample coverage was 0.852 below the required 0.95, so authority and full reproduction remain unapproved.
  component_revision: e2b7fbf328e5fac1d638e217d70a69cbe9f30a52
  evidence:
    - log/pin_slam/static-20261110/plugin-host.log
    - log/pin_slam/static-20261110/plugin-probe.log
    - log/pin_slam/gpu-smoke-20261110/result.json
    - log/pin_slam/gpu-smoke-20261110/canonical-pose.txt
    - log/pin_slam/airsim-shadow-20261110/README.md
  limitations:
    - AirSim 1.8.1 LiDAR has no per-point time and deskew is disabled.
    - Twist is derived from consecutive poses rather than estimated by upstream PIN-SLAM.
    - Not approved as the flight-control authority until shadow acceptance passes.

