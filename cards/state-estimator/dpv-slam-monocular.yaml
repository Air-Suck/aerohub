schema_version: "1.0"
id: state-estimator.dpv-slam-monocular
version: upstream-0ac95b6-aerohub-0.1.0
type: capability
name: DPV-SLAM monocular global correction
description: Provides canonical AS2 pose and twist by composing loop-closing monocular correction with high-rate metric local odometry.

implementation:
  component_id: dpv-slam
  manifest: deployment/dpv_slam/component.yaml
  shared_runtime: dpv-slam-gpu
  coupled_capabilities:
    - perception.dpv-slam-sparse-points

inputs:
  - id: rgb_image
    capability_type: sensor/camera/rgb/image
  - id: camera_calibration
    capability_type: sensor/camera/rgb/camera-info
  - id: metric_local_odometry
    capability_type: state/local/odometry/3d

outputs:
  - id: canonical_pose
    capability_type: state/self/pose/3d
  - id: canonical_twist
    capability_type: state/self/twist/3d

interfaces: []

lifecycle:
  management: shared_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: compute/gpu/cuda
  - hardware_type: sensor/camera/rgb

resource_access:
  reads:
    - sensor/front-rgb
    - vehicle/local-odometry
  shared_writes:
    - compute/gpu
  exclusive_writes:
    - vehicle/self-state
    - vehicle/tf

demo:
  representations:
    - id: canonical_pose
      stage: final
      description: Canonical vehicle pose after visual global correction and metric local composition.
      interface: {protocol: ros2_topic, schema: geometry_msgs/msg/PoseStamped}
      renderer: pose_3d
