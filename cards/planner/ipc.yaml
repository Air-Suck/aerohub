schema_version: "1.0"
id: ipc-native
version: 0f959ca7995e71a1fcc4942bd4a86869ab6ee975
type: capability
name: IPC joint planning and control
description: Consumes local odometry, registered obstacle points, and a FollowReference session to produce local paths and receding-horizon body-rate/thrust control frames.

implementation:
  component_id: ipc_native_core
  manifest: src/tool/navigation/planner/ipc/ros2_adapter/native/component.yaml
  shared_runtime: ipc-native-node
  coupled_capabilities: []

inputs:
  - id: local_odometry
    capability_type: state/local/odometry/3d
  - id: navigation_obstacle_points
    capability_type: perception/navigation/obstacle-points/3d
  - id: control_session
    capability_type: control/external-acro/session

outputs:
  - id: control_frame
    capability_type: control/external-acro/frame
  - id: local_path
    capability_type: planning/path/3d
  - id: ready
    capability_type: diagnostics/readiness/bool
  - id: health
    capability_type: diagnostics/health/text
  - id: processed_points
    capability_type: perception/navigation/processed-obstacle-points/3d

interfaces: []

lifecycle:
  management: system_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: sensor/lidar/3d
  - hardware_type: flight-controller/px4

resource_access:
  reads:
    - vehicle/local-odometry
    - vehicle/environment-points
  shared_writes: []
  exclusive_writes:
    - vehicle/motion

demo:
  representations:
    - id: processed_obstacle_points
      stage: intermediate
      description: Cropped and downsampled obstacle points actually used by the IPC planner.
      interface: {protocol: ros2_topic, schema: sensor_msgs/msg/PointCloud2}
      renderer: point_cloud_3d
    - id: local_path
      stage: final
      description: Current local position-only path produced by IPC for observation.
      interface: {protocol: ros2_topic, schema: nav_msgs/msg/Path}
      renderer: path_3d
