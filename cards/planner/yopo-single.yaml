schema_version: '0.1'
id: planner.yopo-single
name: YOPO reference-mode single vehicle planning
version: '0.1.0'
type: planner
description: Depth-conditioned rolling planning through the existing FollowTimedPath execution Behavior.
component:
  id: aerohub.planner.yopo-single
  manifest: deployment/airsim/demos/yopo_single/component.yaml
  shared_process_group: yopo-planner
  coupled_capabilities: []
usage:
  mode: goal-topic-with-status-and-cancel-service
  selection_phase: deployment
  invocation_interface: geometry_msgs/msg/PoseStamped
  switching_constraints: [complete-stop-before-changing-execution-provider, stop-before-replacing-worker]
inputs:
  - topic: '<namespace>/yopo/goal'
    frame: '<vehicle>/odom fixed ENU'
    state: 'fresh authority pose and twist; body twist requires exact matching pose stamp; bounded history synchronized to axial depth acquisition'
    camera: '90x60-degree pinhole; co-located pitch-only optical extrinsic verified by TF'
outputs:
  - action: '<namespace>/follow_timed_path'
    rolling_update: '<namespace>/follow_timed_path/_behavior/modify'
    semantics: 'all PVA retained, same quintic derivatives, 20ms upstream yaw policy, acknowledged future handoff'
preconditions:
  - Airborne through a separately completed native TakeoffBehavior.
  - Calibrated depth/CameraInfo/TF and fresh measured localization.
  - Inference worker and ROS services ready; matching AS2 execution overlay loaded.
resources:
  reads: [depth-camera, localization, TF, YOPO-inference]
  writes: [single-vehicle-FollowTimedPath-session]
  conflicts: [other-motion-Behaviors-on-same-vehicle]
  enforcement: 'one inference and one execution update in flight; timed/native FollowPath mutually exclusive in execution server; cross-Behavior motion arbitration beyond this Demo is not implemented'
lifecycle:
  startup: 'deploy on compute; workstation calls only ready capabilities'
  readiness: 'yopo/status.ready plus fresh state and verified camera geometry'
  feedback: 'yopo/status task_id, accepted/effective revision; yopo/events submitted curves and acknowledgments'
  completion: 'actual distance<5m then stopped controller and speed<0.2m/s for1s within10s; task separately lands'
  cancel_or_stop: 'Trigger yopo/cancel requests stop; await STOPPED; FAULT requires landing recovery'
  failure: 'three consecutive failures, stale localization/input, clock reset, coverage exhaustion or uncertain execution -> stop'
  recovery: 'task tries native Land even when cancel reports fault; confirm disarmed before cleanup'
type_specific:
  branch: plan_from_reference=True
  model_profile: 'upstream velocity scaling 2m/s, 5s duration; no measured-mode equivalence claimed'
  synchronization: '0.2s future handoff, 0.1s inference timeout, >=0.05s send reserve; timestamps never shifted after results'
validation:
  stage: see-demo-validation
  evidence: [deployment/airsim/demos/yopo_single/validation.md]
  limitations: [not-a-general-Mission-or-Tool-runtime, not-RoboPi-or-real-flight-acceptance, no-precision-final-position]
