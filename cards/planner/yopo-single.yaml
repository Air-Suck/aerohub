schema_version: "1.0"
id: planner.yopo-single
version: "0.1.0"
type: tool
name: YOPO reference-mode single-vehicle navigation
description: Accepts a single-vehicle goal and performs rolling depth-conditioned planning through the existing FollowTimedPath execution chain.

implementation:
  component_id: aerohub.planner.yopo-single
  manifest: deployment/airsim/demos/yopo_single/component.yaml
  shared_runtime: yopo-planner
  coupled_capabilities: []

inputs:
  - id: self_pose
    capability_type: state/self/pose/3d
  - id: self_twist
    capability_type: state/self/twist/3d
  - id: axial_depth
    capability_type: sensor/camera/depth/axial-image
  - id: depth_camera_calibration
    capability_type: sensor/camera/depth/camera-info
  - id: controller_status
    capability_type: control/controller/status

outputs:
  - id: task_status
    capability_type: task/yopo/status
  - id: planning_events
    capability_type: task/yopo/events

interfaces:
  - id: submit_goal
    role: functional_operation
    interaction: managed_task
    protocol: ros2_topic
    schema: geometry_msgs/msg/PoseStamped
    parameter_schema: null
  - id: cancel_task
    role: functional_operation
    interaction: request_response
    protocol: ros2_service
    schema: std_srvs/srv/Trigger
    parameter_schema: null

lifecycle:
  management: system_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: compute/gpu/cuda
  - hardware_type: sensor/camera/depth
  - hardware_type: flight-controller/px4

resource_access:
  reads:
    - sensor/depth-camera
    - vehicle/self-state
    - vehicle/controller-status
  shared_writes:
    - compute/gpu
  exclusive_writes:
    - vehicle/motion

demo:
  representations:
    - id: planned_trajectory_events
      stage: final
      description: Submitted rolling curves and matching execution acknowledgements from the YOPO event stream.
      interface: {protocol: ros2_topic, schema: std_msgs/msg/String}
      renderer: trajectory_3d
