schema_version: "1.0"
id: perception.pin-slam-neural-points
version: upstream-e2b7fbf-aerohub-0.1.0
type: capability
name: PIN-SLAM neural-point anchors
description: Provides downsampled support-point anchors from the shared PIN-SLAM implicit neural map; it is not the complete model or a collision map.

implementation:
  component_id: pin-slam
  manifest: deployment/pin_slam/component.yaml
  shared_runtime: pin-slam-gpu
  coupled_capabilities:
    - state-estimator.pin-slam-lidar

inputs:
  - id: lidar_points
    capability_type: sensor/lidar/point-cloud/3d

outputs:
  - id: neural_point_anchors
    capability_type: perception/map/neural-point-anchors/3d

interfaces:
  - id: save_results
    role: functional_operation
    interaction: request_response
    protocol: ros2_service
    schema: std_srvs/srv/Trigger
    parameter_schema: null
  - id: save_mesh
    role: functional_operation
    interaction: request_response
    protocol: ros2_service
    schema: std_srvs/srv/Trigger
    parameter_schema: null

lifecycle:
  management: shared_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: compute/gpu/cuda
  - hardware_type: sensor/lidar/3d

resource_access:
  reads:
    - sensor/lidar
  shared_writes:
    - compute/gpu
  exclusive_writes: []

demo:
  representations:
    - id: neural_point_anchors
      stage: intermediate
      description: Downsampled anchors exposed from PIN-SLAM's internal neural representation.
      interface: {protocol: ros2_topic, schema: sensor_msgs/msg/PointCloud2}
      renderer: point_cloud_3d
