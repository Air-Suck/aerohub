schema_version: "1.0"
id: perception.dpv-slam-sparse-points
version: upstream-0ac95b6-aerohub-0.1.0
type: capability
name: DPV-SLAM sparse visual landmarks
description: Provides metric-aligned sparse visual patch landmarks from the shared DPV-SLAM process; it does not provide dense geometry or collision-free space.

implementation:
  component_id: dpv-slam
  manifest: deployment/dpv_slam/component.yaml
  shared_runtime: dpv-slam-gpu
  coupled_capabilities:
    - state-estimator.dpv-slam-monocular

inputs:
  - id: rgb_image
    capability_type: sensor/camera/rgb/image
  - id: camera_calibration
    capability_type: sensor/camera/rgb/camera-info
  - id: metric_local_odometry
    capability_type: state/local/odometry/3d

outputs:
  - id: sparse_landmarks
    capability_type: perception/map/sparse-visual-landmarks/3d

interfaces: []

lifecycle:
  management: shared_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: compute/gpu/cuda
  - hardware_type: sensor/camera/rgb

resource_access:
  reads:
    - sensor/front-rgb
    - vehicle/local-odometry
  shared_writes:
    - compute/gpu
  exclusive_writes: []

demo:
  representations:
    - id: sparse_landmarks
      stage: intermediate
      description: Sparse metric visual patch landmarks maintained by DPV-SLAM.
      interface: {protocol: ros2_topic, schema: sensor_msgs/msg/PointCloud2}
      renderer: point_cloud_3d
