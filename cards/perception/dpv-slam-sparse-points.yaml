schema_version: 0.1
id: perception.dpv-slam-sparse-points
name: DPV-SLAM sparse visual landmarks
version: upstream-0ac95b6-aerohub-0.1.0
type: perception
description: Metric-aligned sparse patch landmarks from the shared DPV-SLAM process
component:
  id: dpv-slam
  manifest: deployment/dpv_slam/component.yaml
  shared_process_group: dpv-slam-gpu
  coupled_capabilities: [state-estimator.dpv-slam-monocular]
usage:
  mode: continuous-provider
  selection_phase: deployment
  invocation_interface: /<namespace>/dpv_slam/sparse_points
inputs:
  - interface: DPV-SLAM internal patch graph
    schema: learned sparse visual landmarks
outputs:
  - interface: /<namespace>/dpv_slam/sparse_points
    schema: sensor_msgs/msg/PointCloud2 XYZ float32
    frame: dpv_slam_map
    representation: sparse patch landmarks, not free space or a dense map
resources:
  reads: [drone0.front-rgb, dpv-slam-gpu.patch-graph]
  writes: [drone0.perception.dpv-slam-sparse-points]
  conflicts: [shared DPV-SLAM GPU lifecycle]
lifecycle:
  readiness: nonempty output after visual initialization and metric alignment
  failure: no new map is published while tracking/input is unavailable
  recovery: restart creates a new epoch and coupled state/map reset
type_specific:
  representation: sparse learned visual patch landmarks
  query: no occupancy, ESDF, mesh or collision query interface
  reset: coupled to the DPV-SLAM state process
validation:
  stage: reproduced
  evidence:
    - log/dpv_slam/shadow-schema-0.2-current-frame-20261114-01
    - log/dpv_slam/authority-schema-0.2-current-frame-20261114-01
  limitations:
    - A navigation consumer requires an explicit validated conversion.
    - This sparse landmark view is coupled to the reproduced state process but is not a navigation map.
