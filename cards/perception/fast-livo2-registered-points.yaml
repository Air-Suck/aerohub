schema_version: 0.1
id: perception.fast-livo2-registered-points
name: FAST-LIVO2 registered points
version: ros2-a713004-aerohub-0.2.0
type: perception
description: Registered point output from the shared FAST-LIVO2 process
component:
  id: fast-livo2
  manifest: deployment/fast_livo2/component.yaml
  shared_process_group: fast-livo2
  coupled_capabilities: [state-estimator.fast-livo2]
usage:
  mode: continuous-provider
  selection_phase: deployment
  invocation_interface: /<namespace>/perception/fast_livo2/registered_points
  switching_constraints:
    - Cannot start, stop, reset or upgrade independently of FAST-LIVO2 state estimation.
inputs:
  - interface: FAST-LIVO2 internal registered cloud
    schema: sensor_msgs/msg/PointCloud2
    frame: camera_init local world
    time: corresponding LIO or VIO update time
outputs:
  - interface: /<namespace>/perception/fast_livo2/registered_points
    schema: sensor_msgs/msg/PointCloud2 with original fields and binary layout
    frame: <namespace>/livo_world, transformable to canonical ENU odom
    time: preserved algorithm update time
    representation: registered scan points, not a complete navigation map
hardware_requirements:
  sensors: [imu, rgb-camera, 3d-lidar]
  compute: NVIDIA GPU and fixed onboard-computer runtime
resources:
  reads: [fast-livo2.registered-cloud]
  writes: [drone0.perception.fast-livo2-registered-points]
  conflicts: [shared FAST-LIVO2 process reset]
lifecycle:
  readiness: at least one nonempty cloud with a valid frame and monotonic stamp
  freshness: latest-sample adapter; duplicate state stamps are not republished
  failure: no new cloud after sensor, adapter or algorithm loss
  recovery: process restart creates a new map epoch
type_specific:
  representation: registered point cloud
  query: no occupancy, ESDF, TSDF, mesh or collision query interface
  reset: coupled to the FAST-LIVO2 state process
validation:
  stage: reproduced
  gate: deployment/fast_livo2/validation.yaml
  evidence:
    - log/fast_livo2/shadow-formal-ca38fa8-20261113-01/result.json
    - log/fast_livo2/authority-formal-ca38fa8-20261113-01/result.json
    - log/fast_livo2/sensor-fault-formal-ca38fa8-20261113-02/result.json
    - log/fast_livo2/algorithm-fault-formal-ca38fa8-20261113-01/result.json
  limitations:
    - No navigation consumer may treat this stream as free space without a validated conversion.
