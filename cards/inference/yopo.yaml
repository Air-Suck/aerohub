schema_version: "1.0"
id: inference.yopo
version: "0.1.0"
type: capability
name: YOPO network inference
description: Predicts candidate relative terminal position, velocity, acceleration, and cost values without reconstructing or executing a trajectory.

implementation:
  component_id: aerohub.inference.yopo
  manifest: deployment/inference/component.yaml
  shared_runtime: yopo-model-worker
  coupled_capabilities: []

inputs: []
outputs: []

interfaces:
  - id: infer
    role: functional_operation
    interaction: request_response
    protocol: ros2_service
    schema: uav_inference_interfaces/srv/InferYopo
    parameter_schema: src/inference/interfaces/srv/InferYopo.srv

lifecycle:
  management: system_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: compute/gpu/cuda

resource_access:
  reads:
    - model/yopo/weights
  shared_writes:
    - compute/gpu
  exclusive_writes:
    - inference/yopo/worker
