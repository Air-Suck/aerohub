# Installation resources. Override machine-specific paths in resources.local.yaml.
# Relative paths resolve from this file; ~ expands to the current home directory.
resources:
  ue4_root:
    path: ~/UnrealEngine
  ue4_editor:
    path: ~/UnrealEngine/Engine/Binaries/Linux/UE4Editor
  ue5_root:
    path: ~/UE_installed_build
  ue5_editor:
    path: ~/UE_installed_build/Engine/Binaries/Linux/UnrealEditor
  airsim_source:
    path: ~/AirSim
  airsim_nh:
    path: ~/AirSim/scenes/nh/AirSimNH/Binaries/Linux/AirSimNH
  projectairsim_source:
    path: ~/ProjectAirSim
  projectairsim_blocks:
    path: ~/ProjectAirSim/packages/Blocks/Development/Linux/Blocks/Binaries/Linux/Blocks
  projectairsim_project:
    path: ~/ProjectAirSim/unreal/Blocks/Blocks.uproject
  projectairsim_python:
    path: ~/ProjectAirSim/.venv/bin/python
  projectairsim_ros2_setup:
    path: ~/ProjectAirSim/ros2-overlay/install/setup.bash
