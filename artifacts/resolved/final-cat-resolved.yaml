task:
  name: cat_ora_four_px4
  task_id: d7e1f160-b258-42f3-b8d7-27289c45199a
planner:
  id: cat_ora
  version: 4bc41f593eebde65dd74108a97e80430a145dfa0
  manifest: /opt/uav_planner_ws/install/share/uav_planner_framework/registry/cat_ora/4bc41f593eebde65dd74108a97e80430a145dfa0/manifest.yaml
  runtime:
    image: uav/catora:noetic-px4
    adapter: cat_ora_adapter
    command:
    - ros2
    - run
    - uav_cat_ora_adapter
    - cat_ora_adapter_node
    - --ros-args
    - -p
    - resolved_config:={resolved_config}
    - -p
    - use_sim_time:={use_sim_time}
  parameters:
    trajectory_dt: 0.2
    max_velocity: 1.2
    max_acceleration: 0.6
    trajectory_timeout: 30.0
    valid_from_lead: 3.0
vehicles:
- drone0
- drone1
- drone2
- drone3
targets:
  drone0:
    x: -6.0
    y: -4.0
    z: -1.5
  drone1:
    x: -2.0
    y: -4.0
    z: -1.5
  drone2:
    x: 2.0
    y: -4.0
    z: -1.5
  drone3:
    x: 6.0
    y: -4.0
    z: -1.5
completion:
  position_tolerance: 0.5
  hold_duration: 1.0
  task_timeout: 120.0
coordinates:
  frame: LOCAL_NED
  body_frame: FRD
deployment:
  drone0:
    px4_origin_in_fleet_ned:
    - -4.5
    - -12.0
    - 0.0
    namespace: /drone0
    topics:
      pose: /drone0/self_localization/pose
      trajectory_setpoint: /drone0/planner/setpoint
  drone1:
    px4_origin_in_fleet_ned:
    - -1.5
    - -12.0
    - 0.0
    namespace: /drone1
    topics:
      pose: /drone1/self_localization/pose
      trajectory_setpoint: /drone1/planner/setpoint
  drone2:
    px4_origin_in_fleet_ned:
    - 1.5
    - -12.0
    - 0.0
    namespace: /drone2
    topics:
      pose: /drone2/self_localization/pose
      trajectory_setpoint: /drone2/planner/setpoint
  drone3:
    px4_origin_in_fleet_ned:
    - 4.5
    - -12.0
    - 0.0
    namespace: /drone3
    topics:
      pose: /drone3/self_localization/pose
      trajectory_setpoint: /drone3/planner/setpoint
time:
  use_sim_time: true
  clock_topic: /clock
