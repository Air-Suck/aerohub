<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="610" viewBox="0 0 1780 610" role="img" aria-labelledby="title desc">
<title id="title">SUPER / 探索与安全备份</title><desc id="desc">独立目标、LiDAR与状态输入；探索轨迹连接安全备份，提交时间化轨迹。</desc>
