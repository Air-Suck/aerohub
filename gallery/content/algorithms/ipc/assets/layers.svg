<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1005" viewBox="0 0 1260 1005" role="img" aria-labelledby="title desc"><title id="title">IPC 三层能力</title><desc id="desc">Tool未实现，FollowReference管理会话，IPC在Function层计算控制流。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#b86b20"/></marker><marker id="call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#175da5"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#202d3a"><text x="28" y="40" font-size="25">IPC · Function 算法 + 基础 Behavior 执行</text><rect x="25" y="75" width="1210" height="130" rx="12" fill="white" stroke="#dbe2e9"/><text x="45" y="109" font-size="23">TOOL / 未实现通用任务 Tool</text><text x="55" y="155" font-size="19">独立 ROS 任务客户端调用已有 Behavior；不把 Demo mission.py 当作 Mission / Tool 实现。</text><rect x="25" y="235" width="1210" height="235" rx="12" fill="white" stroke="#dbe2e9"/><text x="45" y="269" font-size="23">BEHAVIOR / 执行与会话管理</text><rect x="55" y="310" width="300" height="105" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="71" y="341" font-size="20">原生起飞 / 降落</text><text x="71" y="370" font-size="17">任务另行调用 / 运动交接</text><rect x="730" y="310" width="465" height="120" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="746" y="341" font-size="20">外部控制流跟随</text><text x="746" y="370" font-size="17">FollowReference 扩展插件</text><text x="746" y="399" font-size="17">目标版本 / 时效 / 取消 / Hover</text><rect x="25" y="500" width="1210" height="345" rx="12" fill="white" stroke="#dbe2e9"/><text x="45" y="534" font-size="23">FUNCTION / 联合规划控制、输入与平台</text><rect x="55" y="575" width="300" height="120" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="71" y="606" font-size="20">状态与环境输入</text><text x="71" y="635" font-size="17">AS2 里程计 / 注册点云</text><text x="71" y="664" font-size="17">earth / body FLU / 时间</text><rect x="420" y="575" width="260" height="120" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="436" y="606" font-size="20">IPC 联合规划控制</text><text x="436" y="635" font-size="17">局部地图 / 路径 / MPC</text><text x="436" y="664" font-size="17">角速度 / 推力转换</text><rect x="730" y="710" width="465" height="105" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="746" y="741" font-size="20">AS2 控制器 / Pixhawk 平台</text><text x="746" y="770" font-size="17">匹配 overlay → PX4</text><path d="M355 635 H420" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M680 610 H710 V365 H730" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M900 430 V475 H550 V575" fill="none" stroke="#175da5" stroke-width="2" marker-end="url(#call)"/><text x="570" y="464" font-size="17">目标 / 会话</text><path d="M1060 430 V710" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><text x="28" y="900" font-size="18">绿：IPC 算法接入　蓝灰：公共执行 / 基础复用　橙箭头：数据　蓝箭头：目标会话</text><text x="28" y="940" font-size="17">Function 内保留规划和控制计算；Behavior 只执行与管理生命周期，不重新求解导航。</text><text x="28" y="976" font-size="17">平台边界：PX4 SITL / AirSim。当前算力与任务共置 PC、进程生命周期独立；非 RoboPi 验收。</text></g></svg>