<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="780" viewBox="0 0 1250 780" role="img" aria-labelledby="title desc"><title id="title">IPC 联合规划控制核心</title><desc id="desc">目标、状态和注册点云经路径搜索、安全走廊与MPC输出角速度和推力。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#b86b20"/></marker><marker id="call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#175da5"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#202d3a"><text x="28" y="40" font-size="25">IPC · 安全走廊硬约束下的联合规划控制</text><rect x="25" y="100" width="230" height="105" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="41" y="131" font-size="20">输入 · 目标与约束</text><text x="41" y="160" font-size="17">固定 yaw / 速度边界</text><rect x="25" y="290" width="230" height="105" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="41" y="321" font-size="20">输入 · 自身状态</text><text x="41" y="350" font-size="17">位置 / 姿态 / 速度</text><rect x="25" y="480" width="230" height="105" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="41" y="511" font-size="20">输入 · 注册点云</text><text x="41" y="540" font-size="17">时间 / earth 坐标</text><rect x="315" y="100" width="255" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="331" y="131" font-size="20">局部 A* / Floyd</text><text x="331" y="160" font-size="17">搜索 / 简化 / 参考采样</text><rect x="315" y="480" width="255" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="331" y="511" font-size="20">局部静态地图</text><text x="331" y="540" font-size="17">裁剪 / 降采样 / 历史</text><rect x="645" y="480" width="245" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="661" y="511" font-size="20">EMVP 安全走廊</text><text x="661" y="540" font-size="17">凸多面体 / 时序约束</text><rect x="645" y="100" width="245" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="661" y="131" font-size="20">滚动 MPC / QP</text><text x="661" y="160" font-size="17">走廊硬约束 / 动力学</text><text x="661" y="189" font-size="17">求解加速度与 jerk</text><rect x="965" y="100" width="250" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="981" y="131" font-size="20">平坦输出转换</text><text x="981" y="160" font-size="17">姿态几何 / 固定 yaw</text><text x="981" y="189" font-size="17">悬停油门映射</text><rect x="965" y="480" width="250" height="105" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="981" y="511" font-size="20">输出 · 控制帧</text><text x="981" y="540" font-size="17">机体角速度 + 推力</text><text x="981" y="569" font-size="17">时间 / 会话 / 求解健康</text><path d="M255 150 H315" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M570 150 H645" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M255 340 H290 V240 H770 V205" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M255 530 H315" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M570 530 H645" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M442 205 V270 H610 V505 H645" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M770 480 V205" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M890 150 H965" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M1090 205 V480" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M350 480 V435 H300 V180 H315" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><text x="28" y="680" font-size="18">红：整体输入 / 输出　绿：算法内核与适配　橙箭头：数据依赖</text><text x="28" y="719" font-size="17">本图对应 Aerohub native：求解与搜索解耦，失败或陈旧解不执行；只画控制输出，不冒充完整时间化轨迹。</text><text x="28" y="753" font-size="17">原生地图和 MPC 共用本机算法部署；上游突发障碍 / 扰动演示不代表本项目已验收这些场景。</text></g></svg>