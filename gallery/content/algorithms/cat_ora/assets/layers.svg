<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">CAT-ORA 在 Aerohub 中的三层能力关系</title>
  <desc id="desc">多机队形规划与调用协调调用时间化路径跟随，读取基础能力数据并经运动控制连接平台。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#716b60"/>
    </marker>
  </defs>
  <rect width="1100" height="650" rx="12" fill="#fcfaf7"/>
  <g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#242522">
    <text x="30" y="37" font-size="22" fill="#242522" text-anchor="start" font-weight="600">CAT-ORA / Aerohub 能力关系</text>
    <rect x="25" y="65" width="1050" height="140" rx="8" fill="none" stroke="#d8d3cc"/>
    <text x="45" y="95" font-size="17" fill="#62605c" text-anchor="start" font-weight="600">TOOL</text>
    <rect x="25" y="225" width="1050" height="140" rx="8" fill="none" stroke="#d8d3cc"/>
    <text x="45" y="255" font-size="17" fill="#62605c" text-anchor="start" font-weight="600">BEHAVIOR</text>
    <rect x="25" y="385" width="1050" height="140" rx="8" fill="none" stroke="#d8d3cc"/>
    <text x="45" y="415" font-size="17" fill="#62605c" text-anchor="start" font-weight="600">FUNCTION</text>
    <rect x="240" y="81" width="660" height="105" rx="8" fill="#e4eee6" stroke="#8fa693"/>
    <text x="258" y="115" font-size="23" fill="#242522" text-anchor="start" font-weight="600">多机队形规划与调用协调</text>
    <text x="258" y="147" font-size="18" fill="#62605c" text-anchor="start">Navigation Tool 的实现基础；通用 Tool 尚未实现</text>
    <rect x="240" y="241" width="660" height="105" rx="8" fill="#e8edf1" stroke="#9aaab7"/>
    <text x="258" y="275" font-size="23" fill="#242522" text-anchor="start" font-weight="600">时间化路径跟随 ×4</text>
    <text x="258" y="307" font-size="18" fill="#62605c" text-anchor="start">扩展 FollowPath / FollowTimedPath · 保留轨迹时间语义</text>
    <rect x="200" y="413" width="265" height="94" rx="8" fill="#e8edf1" stroke="#9aaab7"/>
    <text x="218" y="447" font-size="23" fill="#242522" text-anchor="start" font-weight="600">自身状态 ×4</text>
    <text x="218" y="479" font-size="18" fill="#62605c" text-anchor="start">位置 / 速度</text>
    <rect x="490" y="413" width="265" height="94" rx="8" fill="#f3f0ea" stroke="#c9c1b5"/>
    <text x="508" y="447" font-size="23" fill="#242522" text-anchor="start" font-weight="600">环境感知</text>
    <text x="508" y="479" font-size="18" fill="#62605c" text-anchor="start">本展示链路未接入地图</text>
    <rect x="780" y="413" width="265" height="94" rx="8" fill="#e8edf1" stroke="#9aaab7"/>
    <text x="798" y="447" font-size="23" fill="#242522" text-anchor="start" font-weight="600">运动控制 ×4</text>
    <text x="798" y="479" font-size="18" fill="#62605c" text-anchor="start">参考 + 状态 → 控制</text>
    <path d="M570 186 V241" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="590" y="219" font-size="17" fill="#62605c" text-anchor="start">完整时间化轨迹</text>
    <path d="M900 294 H1055 V398 H913 V413" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="940" y="366" font-size="16" fill="#62605c" text-anchor="start">运动参考</text>
    <path d="M200 460 H180 V134 H240" fill="none" stroke="#716b60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <path d="M180 295 H240" fill="none" stroke="#716b60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="150" y="372" font-size="16" fill="#62605c" text-anchor="end">观测 / 状态</text>
    <path d="M332 507 V536 H913 V507" fill="none" stroke="#716b60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="30" y="563" font-size="17" fill="#62605c" text-anchor="start">绿色：算法能力    蓝灰：公共复用    浅灰：外部输入或未涉及    实线：执行    虚线：数据交互</text>
    <text x="30" y="595" font-size="17" fill="#62605c" text-anchor="start">平台边界：经 AS2 平台连接 PX4。起飞 / 降落由任务编排另行调用基础 Behavior。</text>
    <text x="30" y="625" font-size="17" fill="#62605c" text-anchor="start">×4 表示四个逐机实例；共同基时间由调用协调落实，不表示已完成该规模验收。</text>
  </g>
</svg>
