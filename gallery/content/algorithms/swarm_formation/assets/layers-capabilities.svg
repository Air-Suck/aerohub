<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1035" viewBox="0 0 1260 1035" role="img" aria-labelledby="title desc"><title id="title">Swarm-Formation 三层能力</title><desc id="desc">默认时间化执行链，独立逐机规划、环境表示与公共执行能力。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#b86b20"/></marker><marker id="call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#175da5"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#202d3a"><text x="28" y="40" font-size="25">Swarm-Formation · 三层能力（默认 FollowTimedPath 链）</text><rect x="25" y="75" width="1210" height="235" rx="12" fill="white" stroke="#dbe2e9"/><text x="45" y="109" font-size="23">TOOL / Navigation Tool 的实现基础</text><rect x="55" y="145" width="300" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="71" y="176" font-size="20">分布式编队规划 ×N</text><text x="71" y="205" font-size="17">本机滚动优化 / 轨迹广播</text><rect x="730" y="145" width="465" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="746" y="176" font-size="20">机群轨迹协调</text><text x="746" y="205" font-size="17">采样 / 校验 / 共同基时间 / 失败收口</text><path d="M355 195 H730" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><rect x="25" y="340" width="1210" height="235" rx="12" fill="white" stroke="#dbe2e9"/><text x="45" y="374" font-size="23">BEHAVIOR / 基础执行</text><rect x="55" y="415" width="300" height="105" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="71" y="446" font-size="20">原生起飞 / 降落 ×N</text><text x="71" y="475" font-size="17">由任务入口另行调用</text><rect x="730" y="415" width="465" height="105" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="746" y="446" font-size="20">时间化路径跟随 ×N</text><text x="746" y="475" font-size="17">扩展 FollowPath / 滚动修改</text><path d="M960 250 V415" fill="none" stroke="#175da5" stroke-width="2" marker-end="url(#call)"/><rect x="25" y="605" width="1210" height="245" rx="12" fill="white" stroke="#dbe2e9"/><text x="45" y="639" font-size="23">FUNCTION / 数据、环境表示与运动控制</text><rect x="55" y="675" width="300" height="105" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="71" y="706" font-size="20">状态与传感器 ×N</text><text x="71" y="735" font-size="17">里程计 / TF / 注册点云</text><rect x="420" y="675" width="250" height="105" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="436" y="706" font-size="20">GridMap / ESDF ×N</text><text x="436" y="735" font-size="17">规划器内维护环境表示</text><rect x="730" y="675" width="465" height="105" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="746" y="706" font-size="20">运动控制与平台 ×N</text><text x="746" y="735" font-size="17">AS2 控制器 → PX4</text><path d="M355 725 H420" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M545 675 V655 H690 V265 H300 V250" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M80 675 V655 H12 V265 H170 V250" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><path d="M960 520 V675" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#data)"/><text x="28" y="900" font-size="18">绿：算法与专属接入　蓝灰：公共复用　橙箭头：数据　蓝箭头：执行调用</text><text x="28" y="938" font-size="17">N = 3…7，namespace 为 drone0…droneN−1；×N 是独立实例，不保证同步。</text><text x="28" y="972" font-size="17">地图与本机规划共享进程；中心只聚合轨迹，不是集中式单次规划。</text><text x="28" y="1006" font-size="17">平台边界：AirSim / PX4；历史混合 legacy 执行结果与本图默认链路分开记录。</text></g></svg>