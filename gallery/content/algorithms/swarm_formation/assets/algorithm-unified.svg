<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-labelledby="title desc"><title id="title">Swarm-Formation 算法核心</title><desc id="desc">本机状态与地图、邻机轨迹、目标队形参与逐机多项式优化。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#716b60" /></marker><marker id="call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#716b60" /></marker></defs><rect width="100%" height="100%" rx="12" fill="#fcfaf7" /><g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#242522"><text x="28" y="40" font-size="22" font-weight="600">Swarm-Formation · 逐机滚动优化与编队图约束</text><rect x="25" y="100" width="230" height="105" rx="8" fill="#f5e3e1" stroke="#b96c67" /><text x="41" y="131" font-size="23" font-weight="600" fill="#943f3d">输入 / 编队目标</text><text x="41" y="160" font-size="17" fill="#62605c">中心 / 顶点与车辆索引</text><rect x="25" y="270" width="230" height="105" rx="8" fill="#f5e3e1" stroke="#b96c67" /><text x="41" y="301" font-size="23" font-weight="600" fill="#943f3d">输入 / 本机状态</text><text x="41" y="330" font-size="17" fill="#62605c">起点 PVA / 旧轨迹</text><rect x="25" y="440" width="230" height="105" rx="8" fill="#f5e3e1" stroke="#b96c67" /><text x="41" y="471" font-size="23" font-weight="600" fill="#943f3d">输入 / 局部地图</text><text x="41" y="500" font-size="17" fill="#62605c">障碍距离 / 占据信息</text><rect x="25" y="610" width="230" height="105" rx="8" fill="#f5e3e1" stroke="#b96c67" /><text x="41" y="641" font-size="23" font-weight="600" fill="#943f3d">输入 / 邻机轨迹</text><text x="41" y="670" font-size="17" fill="#62605c">ID / 多项式 / 起始时间</text><rect x="320" y="100" width="265" height="105" rx="8" fill="#e4eee6" stroke="#8fa693" /><text x="336" y="131" font-size="23" font-weight="600">编队图约束</text><text x="336" y="160" font-size="17" fill="#62605c">归一化拉普拉斯矩阵</text><text x="336" y="189" font-size="17" fill="#62605c">与期望队形的差异</text><rect x="320" y="270" width="265" height="105" rx="8" fill="#e4eee6" stroke="#8fa693" /><text x="336" y="301" font-size="23" font-weight="600">局部轨迹初始化</text><text x="336" y="330" font-size="17" fill="#62605c">A* / 旧轨迹接续</text><rect x="660" y="270" width="280" height="105" rx="8" fill="#e4eee6" stroke="#8fa693" /><text x="676" y="301" font-size="23" font-weight="600">MINCO + L-BFGS</text><text x="676" y="330" font-size="17" fill="#62605c">平滑 / 时间 / 动力学</text><text x="676" y="359" font-size="17" fill="#62605c">障碍 / 机间 / 编队代价</text><rect x="1000" y="270" width="250" height="105" rx="8" fill="#f5e3e1" stroke="#b96c67" /><text x="1016" y="301" font-size="23" font-weight="600" fill="#943f3d">输出 / 本机 PolyTraj</text><text x="1016" y="330" font-size="17" fill="#62605c">分段多项式 + 起始时间</text><path d="M255 150 H320" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><path d="M255 320 H320" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><path d="M585 320 H660" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><path d="M585 150 H800 V270" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><path d="M255 490 H620 V350 H660" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><path d="M255 660 H800 V375" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><path d="M940 320 H1000" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><path d="M1125 375 V560 H970 V405 H830 V375" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" stroke-dasharray="6 5" /><text x="930" y="600" font-size="17" fill="#62605c">轨迹广播与跨时刻重规划</text><text x="660" y="715" font-size="18" fill="#62605c">每机独立求解；不是共享代理求解一次</text><text x="28" y="765" font-size="18" fill="#62605c">红：整体输入 / 输出　绿：算法内部　连线：数据依赖与滚动反馈</text><text x="28" y="800" font-size="17" fill="#62605c">邻机轨迹用于预测机间距离与编队误差；执行同步由框架另行管理。</text></g></svg>
