<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1035" viewBox="0 0 1260 1035" role="img" aria-labelledby="title desc"><title id="title">Swarm-Formation 三层能力</title><desc id="desc">默认时间化执行链，独立逐机规划、环境表示与公共执行能力。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#716b60" /></marker><marker id="call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#716b60" /></marker></defs><rect width="100%" height="100%" rx="12" fill="#fcfaf7" /><g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#242522"><text x="28" y="40" font-size="22" font-weight="600">Swarm-Formation · 三层能力（默认 FollowTimedPath 链）</text><rect x="25" y="75" width="1210" height="235" rx="8" fill="none" stroke="#d8d3cc" /><text x="45" y="109" font-size="17" font-weight="600">TOOL / Navigation Tool 的实现基础</text><rect x="55" y="145" width="300" height="105" rx="8" fill="#e4eee6" stroke="#8fa693" /><text x="71" y="176" font-size="23" font-weight="600">分布式编队规划 ×N</text><text x="71" y="205" font-size="17" fill="#62605c">本机滚动优化 / 轨迹广播</text><rect x="730" y="145" width="465" height="105" rx="8" fill="#e4eee6" stroke="#8fa693" /><text x="746" y="176" font-size="23" font-weight="600">机群轨迹协调</text><text x="746" y="205" font-size="17" fill="#62605c">采样 / 校验 / 共同基时间 / 失败收口</text><path d="M355 195 H730" fill="none" stroke="#716b60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#data)" /><rect x="25" y="340" width="1210" height="235" rx="8" fill="none" stroke="#d8d3cc" /><text x="45" y="374" font-size="17" font-weight="600">BEHAVIOR / 基础执行</text><rect x="55" y="415" width="300" height="105" rx="8" fill="#e8edf1" stroke="#9aaab7" /><text x="71" y="446" font-size="23" font-weight="600">原生起飞 / 降落 ×N</text><text x="71" y="475" font-size="17" fill="#62605c">由任务入口另行调用</text><rect x="730" y="415" width="465" height="105" rx="8" fill="#e8edf1" stroke="#9aaab7" /><text x="746" y="446" font-size="23" font-weight="600">时间化路径跟随 ×N</text><text x="746" y="475" font-size="17" fill="#62605c">扩展 FollowPath / 滚动修改</text><path d="M960 250 V415" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#call)" /><rect x="25" y="605" width="1210" height="245" rx="8" fill="none" stroke="#d8d3cc" /><text x="45" y="639" font-size="17" font-weight="600">FUNCTION / 数据、环境表示与运动控制</text><rect x="55" y="675" width="300" height="105" rx="8" fill="#e8edf1" stroke="#9aaab7" /><text x="71" y="706" font-size="23" font-weight="600">状态与传感器 ×N</text><text x="71" y="735" font-size="17" fill="#62605c">里程计 / TF / 注册点云</text><rect x="420" y="675" width="250" height="105" rx="8" fill="#e4eee6" stroke="#8fa693" /><text x="436" y="706" font-size="23" font-weight="600">GridMap / ESDF ×N</text><text x="436" y="735" font-size="17" fill="#62605c">规划器内维护环境表示</text><rect x="730" y="675" width="465" height="105" rx="8" fill="#e8edf1" stroke="#9aaab7" /><text x="746" y="706" font-size="23" font-weight="600">运动控制与平台 ×N</text><text x="746" y="735" font-size="17" fill="#62605c">AS2 控制器 → PX4</text><path d="M355 725 H420" fill="none" stroke="#716b60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#data)" /><path d="M545 675 V655 H690 V265 H300 V250" fill="none" stroke="#716b60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#data)" /><path d="M80 675 V655 H12 V265 H170 V250" fill="none" stroke="#716b60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#data)" /><path d="M960 520 V675" fill="none" stroke="#716b60" stroke-width="2" marker-end="url(#data)" /><text x="28" y="900" font-size="18" fill="#62605c">绿：算法与专属接入　蓝灰：公共复用　虚线：数据　实线：执行调用</text><text x="28" y="938" font-size="17" fill="#62605c">N = 3…7，namespace 为 drone0…droneN−1；×N 是独立实例，不保证同步。</text><text x="28" y="972" font-size="17" fill="#62605c">地图与本机规划共享进程；中心只聚合轨迹，不是集中式单次规划。</text><text x="28" y="1006" font-size="17" fill="#62605c">平台边界：AirSim / PX4；历史混合 legacy 执行结果与本图默认链路分开记录。</text></g></svg>
