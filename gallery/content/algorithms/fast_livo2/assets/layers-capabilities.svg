<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="910" viewBox="0 0 1120 910" role="img" aria-labelledby="title desc"><title id="title">FAST-LIVO2 三层能力</title><desc id="desc">Function 层的联合算法提供状态估计与环境点云，Tool 和 Behavior 未涉及。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#b86b20"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#202d3a"><text x="30" y="42" font-size="25">FAST-LIVO2 · 三层能力与数据依赖</text><rect x="30" y="80" width="1060" height="100" rx="10" fill="#f1f3f5" stroke="#a1acb8"/><text x="48" y="112" font-size="20">TOOL / 工具层 · 未涉及</text><text x="48" y="141" font-size="17">本接入未注册任务 Tool；状态与环境数据可供上层直接读取</text><rect x="30" y="205" width="1060" height="100" rx="10" fill="#f1f3f5" stroke="#a1acb8"/><text x="48" y="237" font-size="20">BEHAVIOR / 基础行为层 · 未直接调用</text><text x="48" y="266" font-size="17">不提交运动 Action；定位与点云发布不具有运动行为生命周期</text><rect x="30" y="330" width="1060" height="440" rx="12" fill="white" stroke="#dbe2e9"/><text x="52" y="367" font-size="24">FUNCTION / 基础能力层</text><rect x="55" y="405" width="250" height="115" rx="10" fill="#eef3f8" stroke="#175da5"/><text x="73" y="437" font-size="20">传感器与时间 / 标定</text><text x="73" y="466" font-size="17">IMU · RGB · LiDAR</text><text x="73" y="495" font-size="17">平台驱动 / 仿真 / 回放</text><rect x="365" y="405" width="325" height="115" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="383" y="437" font-size="20">FAST-LIVO2 联合定位建图</text><text x="383" y="466" font-size="17">一个算法实例</text><text x="383" y="495" font-size="17">共享内部地图与状态</text><rect x="750" y="405" width="310" height="115" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="768" y="437" font-size="20">State Estimator</text><text x="768" y="466" font-size="17">自身位姿 / 速度 / TF</text><text x="768" y="495" font-size="17">安装外参与世界对齐</text><rect x="750" y="595" width="310" height="115" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="768" y="627" font-size="20">Perception</text><text x="768" y="656" font-size="17">配准点云</text><text x="768" y="685" font-size="17">保留三维字段与测量时间</text><path d="M305 460 H365" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 460 H750" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 520 V650 H750" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><text x="55" y="747" font-size="18">两路能力共享算法与部署依赖；桥接、插件和接口细节见补充信息。</text><text x="30" y="810" font-size="18">绿色：算法与专属接入　蓝色：外部复用　灰色：未涉及　橙色箭头：数据</text><text x="30" y="850" font-size="17">平台边界：AS2 消费状态不代表 PX4 融合；配准点云不等于占据图 / ESDF。</text><text x="30" y="883" font-size="17">单机结构示意；不证明多机协同或状态权威切换已通过。</text></g></svg>