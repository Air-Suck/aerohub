<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="790" viewBox="0 0 1390 790" role="img" aria-labelledby="title desc"><title id="title">FAST-LIVO2 算法核心</title><desc id="desc">从左到右阅读，激光和视觉顺序更新，共享地图反馈。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#b86b20"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#202d3a"><text x="28" y="40" font-size="25">FAST-LIVO2 · 直接法融合与顺序状态更新</text><rect x="25" y="95" width="195" height="110" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="43" y="127" font-size="20">输入 · IMU</text><text x="43" y="156" font-size="17">测量时间 / 标定</text><rect x="25" y="245" width="195" height="100" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="43" y="277" font-size="20">输入 · 激光点云</text><text x="43" y="306" font-size="17">含逐点采样语义</text><rect x="25" y="395" width="195" height="100" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="43" y="427" font-size="20">输入 · 图像</text><text x="43" y="456" font-size="17">内外参与时间对齐</text><rect x="275" y="95" width="220" height="110" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="293" y="127" font-size="20">IMU 状态传播</text><text x="293" y="156" font-size="17">预测运动状态</text><text x="293" y="185" font-size="17">辅助点云去畸变</text><rect x="550" y="245" width="240" height="100" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="568" y="277" font-size="20">激光几何更新</text><text x="568" y="306" font-size="17">原始点与地图配准</text><rect x="845" y="395" width="240" height="100" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="863" y="427" font-size="20">视觉光度更新</text><text x="863" y="456" font-size="17">直接图像对齐</text><rect x="550" y="575" width="535" height="100" rx="10" fill="#d9f3ed" stroke="#168b78"/><text x="568" y="607" font-size="20">统一体素地图 · 跨时刻维护</text><text x="568" y="636" font-size="17">几何平面先验 / 参考图像块</text><rect x="1140" y="245" width="225" height="100" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="1158" y="277" font-size="20">输出 · 自身状态</text><text x="1158" y="306" font-size="17">位姿 / 速度</text><rect x="1140" y="575" width="225" height="100" rx="10" fill="#fce8e8" stroke="#b64b55"/><text x="1158" y="607" font-size="20">输出 · 配准点云</text><text x="1158" y="636" font-size="17">环境三维表示</text><path d="M220 150 H275" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M495 150 H670 V245" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 295 H550" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 295 H965 V395" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 445 H845" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M1085 445 H1110 V295 H1140" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 345 V575" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M965 495 V575" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 575 V360 H530 V320 H550" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M1085 610 H1105 V470 H1085" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><path d="M1085 625 H1140" fill="none" stroke="#b86b20" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="730" font-size="18">红色：整体输入 / 输出　绿色：算法内部方法与地图　橙色箭头：数据与跨时刻复用</text><text x="28" y="765" font-size="17">方法示意，依据作者论文；对外配准点云不等于占据图或 ESDF。</text></g></svg>