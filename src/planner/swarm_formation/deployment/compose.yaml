name: uav-aerostack2-swarm-formation

services:
  swarm-formation:
    build:
      context: ../../../..
      dockerfile: src/planner/swarm_formation/deployment/Dockerfile
    image: uav/aerostack2-swarm-formation:humble
    container_name: planner-swarm-formation
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-81}"
      FASTRTPS_DEFAULT_PROFILES_FILE: /config/dds.xml
    volumes:
      - "${SWARM_FLEET_CONFIG:?Set an absolute path to calibrated seven-vehicle navigation configuration}:/config/fleet.yaml:ro"
      - "${SWARM_DDS_PROFILE:-../../../config/dds/fastdds_udp.xml}:/config/dds.xml:ro"
    restart: unless-stopped
