[project]
name = "aerohub-yopo-worker"
version = "0.1.0"
requires-python = ">=3.8,<3.9"
dependencies = [
  "aerohub-inference-runtime",
  "torch==2.4.1+cu118",
  "numpy==1.22.3",
  "scipy==1.10.1",
  "opencv-python-headless==4.11.0.86",
  "ruamel-yaml==0.17.21",
  # Name CUDA runtime dependencies explicitly to pin their official wheel source.
  "triton==3.0.0",
  "nvidia-cublas-cu11==11.11.3.6",
  "nvidia-cuda-cupti-cu11==11.8.87",
  "nvidia-cuda-nvrtc-cu11==11.8.89",
  "nvidia-cuda-runtime-cu11==11.8.89",
  "nvidia-cudnn-cu11==9.1.0.70",
  "nvidia-cufft-cu11==10.9.0.58",
  "nvidia-curand-cu11==10.3.0.86",
  "nvidia-cusolver-cu11==11.4.1.48",
  "nvidia-cusparse-cu11==11.7.5.86",
  "nvidia-nccl-cu11==2.20.5",
  "nvidia-nvtx-cu11==11.8.86",
]

[tool.uv.sources]
aerohub-inference-runtime = { path = "../../runtime", editable = true }
torch = { index = "pytorch-cu118" }
triton = { index = "pytorch-cu118" }
nvidia-cublas-cu11 = { index = "pytorch-cu118" }
nvidia-cuda-cupti-cu11 = { index = "pytorch-cu118" }
nvidia-cuda-nvrtc-cu11 = { index = "pytorch-cu118" }
nvidia-cuda-runtime-cu11 = { index = "pytorch-cu118" }
nvidia-cudnn-cu11 = { index = "pytorch-cu118" }
nvidia-cufft-cu11 = { index = "pytorch-cu118" }
nvidia-curand-cu11 = { index = "pytorch-cu118" }
nvidia-cusolver-cu11 = { index = "pytorch-cu118" }
nvidia-cusparse-cu11 = { index = "pytorch-cu118" }
nvidia-nccl-cu11 = { index = "pytorch-cu118" }
nvidia-nvtx-cu11 = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
