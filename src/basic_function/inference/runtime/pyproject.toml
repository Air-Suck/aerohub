[project]
name = "aerohub-inference-runtime"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["fastapi==0.115.14", "uvicorn==0.33.0"]

[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aerohub_inference*"]
