name: uav-followpath-acceptance
services:
  as2:
    extends:
      file: ../../../deployment/integration/compose.yaml
      service: as2
    container_name: followpath-test-as2
    image: ${FOLLOW_PATH_TEST_IMAGE:-uav/aerostack2-planner-runtime:humble}
    restart: "no"
  px4:
    extends:
      file: ../../../deployment/integration/compose.yaml
      service: px4
    container_name: followpath-test-px4
    restart: "no"
  runtime:
