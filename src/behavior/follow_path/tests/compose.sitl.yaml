      file: ../../../deployment/integration/compose.yaml
      service: clock
    container_name: followpath-test-clock
    image: ${FOLLOW_PATH_TEST_IMAGE:-uav/aerostack2-planner-runtime:humble}
    restart: "no"
  cat-ora:
    extends:
      file: ../../../deployment/integration/compose.yaml
      service: cat-ora
    container_name: followpath-test-cat-ora
    restart: "no"
  swarm-formation:
    extends:
      file: ../../../deployment/integration/compose.yaml
      service: swarm-formation
    container_name: followpath-test-swarm
    image: ${FOLLOW_PATH_SWARM_TEST_IMAGE:-uav/aerostack2-swarm-formation:noetic}
