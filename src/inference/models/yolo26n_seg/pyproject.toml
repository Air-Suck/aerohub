[project]
name = "aerohub-yolo26n-seg-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["aerohub-inference-runtime", "ultralytics==8.4.210", "torch==2.6.0", "torchvision==0.21.0", "numpy==1.26.4", "opencv-python==4.11.0.86", "pyyaml==6.0.3"]

[tool.uv.sources]
aerohub-inference-runtime = {path = "../../runtime"}
torch = {index = "pytorch-cu124"}
torchvision = {index = "pytorch-cu124"}

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
