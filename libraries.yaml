# 可复用算法能力注册表；路径相对于仓库根目录。
# registered 表示源码已收录；可运行组合以 bindings 为准。
schema_version: 1
environments:
  airsim_px4:
    description: AirSim / PX4 1.18 / AS2；单机平台与 CAT-ORA NH 四机应用通过，其他组合按 binding 状态
    simulator: airsim
    flight_controller: px4
    lifecycle: development
    setup: config/airsim/README.md
    scene_profiles:
      nh: config/airsim/nh.json
      town05: config/airsim/town05.json
      plant: config/airsim/plant.json
libraries:
  cat_ora:
    name: CAT-ORA
    description: 多机目标分配与轨迹规划；当前接入要求保持任务指定的逐机目标归属
    kind: planner
    status: registered
    manifest: planner_framework/registry/cat_ora/4bc41f593eebde65dd74108a97e80430a145dfa0/manifest.yaml
    implementation:
      adapter: libraries/cat_ora/ros2_adapter
      proxy: libraries/cat_ora/humble/scripts/ros2_proxy.py
      native: libraries/cat_ora/humble
    bindings:
      airsim_px4:
        validation: scenario_pass
        reason: PC AirSimNH 空旷路口四机起飞、原生 CAT-ORA 规划、到点保持、降落及实际位置验收通过；未覆盖其他场景或 RoboPi 多机
        application: apps/catora_open_field/README.md
        evidence: apps/catora_open_field/validation.json
    docs: libraries/README.md
    history:
      ref: main
      environment: gazebo_px4_1_17
      validation: historical_pass
      evidence: artifacts/resolved/FINAL_VERIFICATION.md
      commit: c420169460e59c396f586320e0e06fc96e387f6e
  swarm_formation:
    name: Swarm-Formation
    description: 七机编队滚动轨迹规划
    kind: planner
    status: registered
    manifest: planner_framework/registry/swarm_formation/967a4bdfae949e994691f8ffc87dbb0147cbebb7/manifest.yaml
    implementation:
      adapter: libraries/swarm_formation/ros2_adapter
      proxy: libraries/swarm_formation/humble/plan_manage/scripts/ros2_proxy.py
      native: libraries/swarm_formation/humble
    bindings:
      airsim_px4:
        validation: not_integrated
        reason: 单机真实 AirSim LiDAR 到原生地图/ESDF 已通过；七机传感器并发、目标契约及飞行闭环仍待验收
        point_cloud_validation: real_sensor_map_pass
        point_cloud_evidence: libraries/swarm_formation/validation/real-point-cloud.json
    docs: libraries/README.md
    history:
      ref: main
      environment: gazebo_px4_1_17
      validation: historical_pass
      evidence: artifacts/resolved/FINAL_VERIFICATION.md
      commit: c420169460e59c396f586320e0e06fc96e387f6e
