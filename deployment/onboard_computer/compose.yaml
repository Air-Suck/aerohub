name: aerohub-onboard-computer
services:
  as2:
    image: "${ONBOARD_COMPUTER_IMAGE:-onboard_computer:v0.1.0}"
    build:
      context: ../..
      dockerfile: deployment/onboard_computer/Dockerfile
    init: true
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-81}"
      AS2_FLEET_FILE: /config/fleet.yaml
      AS2_CONFIG_FILE: /config/as2.yaml
    volumes:
      - ../../config/as2/fleet.yaml:/config/fleet.yaml:ro
      - ../../config/as2/config.yaml:/config/as2.yaml:ro
    stop_grace_period: 10s
