name: aerohub-dpv-slam
services:
  algorithm:
    image: uav/dpv-slam:humble
    build:
      context: ../..
      dockerfile: deployment/dpv_slam/Dockerfile.algorithm
      args:
        BASE_IMAGE: "${ONBOARD_DEPENDENCIES_IMAGE:-onboard_computer_dependencies:humble-px4-1.18-msgfix}"
        PYTORCH_IMAGE: "${DPV_SLAM_PYTORCH_IMAGE:-uav/pin-slam:humble}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${http_proxy:-}"
        https_proxy: "${https_proxy:-}"
    init: true
    network_mode: host
    runtime: nvidia
    environment:
      ROS_DOMAIN_ID: "${DPV_SLAM_DOMAIN:-82}"
      DPV_SLAM_NAMESPACE: "${DPV_SLAM_NAMESPACE:-drone0}"
      NVIDIA_VISIBLE_DEVICES: "${DPV_SLAM_GPU:-0}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./algorithm.params.yaml:/config/algorithm.yaml:ro
      - ../../log/dpv_slam:/results
    stop_grace_period: 30s
  estimator:
    image: uav/dpv-slam-as2:humble
    build:
      context: ../..
      dockerfile: deployment/dpv_slam/Dockerfile.as2
      args:
        BASE_IMAGE: "${ONBOARD_COMPUTER_IMAGE:-onboard_computer:main-e2e}"
    init: true
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${DPV_SLAM_DOMAIN:-82}"
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /root/aerostack2_ws/install/setup.bash && source /opt/dpv_slam_as2_ws/install/setup.bash && exec ros2 launch uav_dpv_slam dpv_slam.launch.py namespace:=${DPV_SLAM_NAMESPACE:-drone0} use_sim_time:=true"]
    stop_grace_period: 10s
