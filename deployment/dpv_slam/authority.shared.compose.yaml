services:
  as2:
    image: "${ONBOARD_COMPUTER_IMAGE:-onboard_computer:v0.1.0}"
    environment:
      ROS_DOMAIN_ID: "${DPV_SLAM_DOMAIN:-82}"
      AS2_STATE_ESTIMATOR_PLUGIN: dpv_slam
      AS2_STATE_ESTIMATOR_CONFIG_FILE: /config/dpv-slam-estimator.yaml
      AS2_STATE_ESTIMATOR_LAUNCH_PACKAGE: uav_dpv_slam
      AS2_STATE_ESTIMATOR_LAUNCH_FILE: dpv_slam.launch.py
    volumes:
      - "${DPV_SLAM_WORKSPACE:?set DPV_SLAM_WORKSPACE to the prepared absolute path}:/workspace/dpv:ro"
      - "${PX4_MSGS_OVERLAY_WORKSPACE:?set PX4_MSGS_OVERLAY_WORKSPACE to the prepared absolute path}:/px4-overlay:ro"
      - "${AS2_EXECUTION_WORKSPACE:?set AS2_EXECUTION_WORKSPACE to the prepared absolute path}:/as2-overlay:ro"
      - ../../src/basic_function/state_estimator/dpv_slam/plugin/config/estimator.yaml:/config/dpv-slam-estimator.yaml:ro
      - ../airsim/as2/run.py:/opt/onboard_computer/run.py:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        source /opt/ros/humble/setup.bash &&
        source /opt/px4_ws/install/setup.bash &&
        source /px4-overlay/install/setup.bash &&
        source /root/aerostack2_ws/install/setup.bash &&
        source /as2-overlay/install/setup.bash &&
        source /workspace/dpv/plugin/install/setup.bash &&
        exec python3 /opt/onboard_computer/run.py
