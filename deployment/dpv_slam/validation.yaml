schema_version: 0.1
scenario: dpv-slam-airsim-state-acceptance
platform:
  simulator: AirSim 1.8.1, visible window
  flight_controller: PX4 SITL
  candidate: DPV-SLAM loop closure enabled, classical backend disabled
  metric_alignment: first 30 initialized visual frames aligned once to paired PX4 local odometry; AirSim truth is scoring-only
duration:
  minimum_airborne_seconds: 60.0
  minimum_horizontal_truth_motion_m: 8.0
gates:
  image_input_rate_min_hz: 8.0
  candidate_output_rate_min_hz: 3.0
  sample_coverage_min: 0.80
  # DPV-SLAM is a global correction source, not the high-rate control state.
  maximum_output_gap_s: 1.5
  horizontal_rmse_max_m: 0.75
  position_rmse_max_m: 1.0
  position_p95_max_m: 1.5
  yaw_p95_max_deg: 12.0
  alignment_scale_min: 0.05
  alignment_scale_max: 20.0
  alignment_rmse_max_m: 0.35
  tracking_loss_events_max: 0
  non_monotonic_output_count_max: 0
  sparse_point_samples_min: 1
authority_rule: All gates must pass in one shadow run before DPV-SLAM may provide map-to-odom correction in the AS2 authority stack.
authority_canonical_maximum_gap_s: 0.1
required_evidence:
  - source revision, dirty diff, image IDs, weights SHA256, configuration and commands
  - visible AirSim screenshot and process identity
  - ROS graph proving real RGB/CameraInfo input, DPV-SLAM output and AS2 plugin output
  - paired truth and candidate samples plus machine-readable gate report
  - independent sparse-point consumer, controlled landing/disarm and cleanup result
