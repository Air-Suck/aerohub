  ros_adapter: python3 -m uav_inference.diffphys_node
  endpoint: http://127.0.0.1:8001
  namespace: configurable
  readiness: HTTP-/health/ready-and-ROS-inference/diffphys/status
  stop: SIGINT-to-owned-adapter-and-worker-and-confirm-exit
  rollback: stop-restore-source-and-lock-rebuild-overlay-restart-with-explicit-hidden-reset
resources:
  gpu: selected-by-CUDA_VISIBLE_DEVICES
  arbitration: one-inflight-per-worker-no-cross-model-arbiter
  hidden_state: caller-owned-per-vehicle-and-task
validation:
  evidence: src/basic_function/inference/models/diffphys/validation.json
  limitations: [synthetic-input-only, no-Planner-or-Behavior, no-flight-validation]
