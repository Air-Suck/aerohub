schema_version: '0.1'
id: aerohub.inference.diffphys
version: 0.1.0
source:
  upstream: src/tool/navigation/planner/diffphys/upstream
  revision: 271936190b5c2a5e760230e718fa6b167718a5bf
  license: null
  license_note: No explicit DiffPhys license found in inspected upstream/release directories.
  release_artifacts: src/basic_function/inference/models/diffphys/artifacts.json
provides:
- inference.diffphys
cards:
- cards/inference/diffphys.yaml
roles:
