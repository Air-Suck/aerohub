schema_version: 0.1
id: pin-slam
version: upstream-e2b7fbf-aerohub-0.1.0
description: PIN-SLAM LiDAR pose estimation and implicit neural-point mapping
source:
  repository: https://github.com/PRBonn/PIN_SLAM.git
  commit: e2b7fbf328e5fac1d638e217d70a69cbe9f30a52
  submodule_path: src/state_estimator/pin_slam/upstream
  upstream_modified: false
  license: MIT
capabilities:
  - state-estimator.pin-slam-lidar
  - perception.pin-slam-neural-points
cards:
  - cards/state-estimator/pin-slam-lidar.yaml
  - cards/perception/pin-slam-neural-points.yaml
shared_process_group: pin-slam-gpu
environment:
  shared_image: onboard_computer:v0.1.0
  shared_image_id: sha256:964048afd46a9d394aa771d801d48b57de8a2b2665979b1ba6f2b5e273f9adb9
  architectures: [linux/amd64]
  workspace: log/workspaces/pin_slam
  python_environment: log/workspaces/pin_slam/venv
  ros_overlay: log/workspaces/pin_slam/ros/install
  prepare: deployment/pin_slam/prepare_workspace.sh
runtime:
  roles:
    simulator: AirSim host process
    flight_board: PX4 SITL, DDS Agent, LiDAR and clock bridge
    compute: PIN-SLAM algorithm plus AS2 State Estimator plugin
    workstation: shadow scoring and lifecycle orchestration
  namespace: drone0
  clock: AirSim /clock
  input:
    lidar: /drone0/sensor_measurements/Lidar/points
    local_odometry: /drone0/sensor_measurements/odom
  output_state: /drone0/pin_slam/odometry
  output_map: /drone0/pin_slam/neural_points
requirements:
  gpu: NVIDIA GPU with at least 4 GiB memory; 24 GiB used for current validation host
  sensors: one metrically calibrated LiDAR with a static base-to-sensor transform
  platform: AirSim 1.8.1 plus PX4 SITL for project acceptance
  calibration: sensor_from_base must be measured for non-simulated platforms
lifecycle:
  startup: start platform LiDAR and /clock, algorithm, then AS2 plugin
  readiness: fresh PX4 local odometry, a time-paired PIN-SLAM correction, nonempty neural-point map, and healthy diagnostics
  stop: remove state authority before stopping the shared algorithm process
  failure: stale, invalid, non-monotonic, or unpaired PIN-SLAM output cannot update the global correction; high-rate PX4 local state remains available for controlled landing
  recovery: restart as a new map epoch while the vehicle is not executing a task
authority:
  state_and_tf: exactly one selected AS2 State Estimator provider per vehicle
  map_frame: PIN-SLAM process owns pin_slam_map data; AS2 plugin publishes its configured alias
validation:
  stage: reproduced
  gate: deployment/pin_slam/validation.yaml
  scope: Shared onboard-computer image, visible AirSim + PX4 SITL, real LiDAR input, GPU PIN-SLAM, AS2 authority, canonical freshness, LiDAR interruption, and algorithm-process exit all passed the declared matrix.
  evidence:
    - log/pin_slam/shadow-shared-final-20261114-17/gate-report.json
    - log/pin_slam/shadow-shared-final-20261114-17/result.json
    - log/pin_slam/authority-20261114-02/gate-report.json
    - log/pin_slam/authority-20261114-02/result.json
    - log/pin_slam/authority-20261114-02/canonical-freshness.json
    - log/pin_slam/sensor-fault-20261114-02/result.json
    - log/pin_slam/sensor-fault-20261114-02/fault-injection.json
    - log/pin_slam/sensor-fault-20261114-02/aerohub-pin-slam-as2.log
    - log/pin_slam/algorithm-fault-20261114-01/result.json
    - log/pin_slam/algorithm-fault-20261114-01/fault-injection.json
    - log/pin_slam/algorithm-fault-20261114-01/aerohub-pin-slam-as2.log
  limitations:
    - Neural-point anchors are not a collision map or the complete implicit model.
    - Current authority integration deliberately retains PX4 EKF local odometry for control; PIN-SLAM is the global correction source, not the sole inertial estimator.
    - AirSim LiDAR lacks per-point time, so deskew remains disabled.

