name: aerohub-pin-slam
services:
  algorithm:
    image: "${ONBOARD_COMPUTER_IMAGE:-onboard_computer:v0.1.0}"
    init: true
    network_mode: host
    runtime: nvidia
    environment:
      ROS_DOMAIN_ID: "${PIN_SLAM_DOMAIN:-81}"
      PIN_SLAM_USE_SIM_TIME: "${PIN_SLAM_USE_SIM_TIME:-true}"
      PIN_SLAM_NAMESPACE: "${PIN_SLAM_NAMESPACE:-drone0}"
      PIN_SLAM_ROOT: /repo/src/state_estimator/pin_slam/upstream
      PYTHONPATH: /repo/src/state_estimator/pin_slam/upstream
      NVIDIA_VISIBLE_DEVICES: "${PIN_SLAM_GPU:-0}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - "${AEROHUB_ROOT:-../..}:/repo:ro"
      - "${PIN_SLAM_WORKSPACE:-../../log/workspaces/pin_slam}:/workspace:ro"
      - ./airsim.yaml:/config/airsim.yaml:ro
      - ./algorithm.params.yaml:/config/algorithm.yaml:ro
      - ../../log/pin_slam:/results
    entrypoint: [bash, -lc]
    command:
      - >-
        set -eo pipefail;
        source /opt/ros/humble/setup.bash;
        source /root/aerostack2_ws/install/setup.bash;
        source /workspace/venv/bin/activate;
        source /workspace/ros/install/setup.bash;
        exec /workspace/venv/bin/python
        /workspace/ros/install/lib/uav_pin_slam_ros2/pin_slam_node
        --ros-args -r __ns:=/${PIN_SLAM_NAMESPACE:-drone0}
        --params-file /config/algorithm.yaml
        -p use_sim_time:=${PIN_SLAM_USE_SIM_TIME:-true}
    stop_grace_period: 30s

  estimator:
    profiles: [plugin-smoke]
    image: "${ONBOARD_COMPUTER_IMAGE:-onboard_computer:v0.1.0}"
    init: true
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${PIN_SLAM_DOMAIN:-81}"
      PIN_SLAM_USE_SIM_TIME: "${PIN_SLAM_USE_SIM_TIME:-true}"
    volumes:
      - "${AEROHUB_ROOT:-../..}:/repo:ro"
      - "${PIN_SLAM_WORKSPACE:-../../log/workspaces/pin_slam}:/workspace:ro"
    entrypoint: [bash, -lc]
    command:
      - >-
        set -eo pipefail;
        source /opt/ros/humble/setup.bash;
        source /root/aerostack2_ws/install/setup.bash;
        source /workspace/ros/install/setup.bash;
        exec ros2 launch uav_pin_slam pin_slam.launch.py
        namespace:=${PIN_SLAM_NAMESPACE:-drone0}
        use_sim_time:=${PIN_SLAM_USE_SIM_TIME:-true}
    stop_grace_period: 10s
