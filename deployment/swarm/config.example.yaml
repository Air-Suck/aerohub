schema_version: 1

deployment:
  # Early development runs every UAV compute node in an onboard-computer container.
  stage: pc_simulation

fleet:
  vehicle_count: 3
  coordinator_vehicle_index: 0
  name_prefix: drone
  airsim_name_prefix: Drone
  initial_spacing_m: 4.0

nodes:
  onboard_computer:
    # Each UAV gets its own onboard-computer container, process and supervisor thread.
    image: onboard_computer:v0.1.0
    launch_command:
      - bash
      - -lc
      - >-
        docker run --rm --init --network host
        --name aerohub-swarm-{vehicle}
        -e AEROHUB_SWARM_VEHICLE={vehicle}
        -e AEROHUB_SWARM_CENTER={center_vehicle}
        -v {output}/overlay:/run/aerohub-overlay:ro
        {onboard_computer_image}
        bash -lc 'source /run/aerohub-overlay/install/setup.bash &&
        exec aerohub-onboard-node --vehicle {vehicle} --center {center_vehicle}'
  board:
    # Used only after deployment.stage is changed to hybrid_board.
    launch_command:
      - bash
      - -lc
      - >-
        ssh "$AEROHUB_BOARD_HOST"
        aerohub-board-node --vehicle {vehicle} --center {center_vehicle}

coordination:
  mode: centralized
  centralized_cases:
    - onboard_center

ground_station:
  required: true
  placement: pc
  launch_command:
    - bash
    - -lc
    - >-
      aerohub-ground-station --scenario {scenario} --center {center_vehicle}

airsim:
  base_settings: ../../simulator/airsim/scenarios/swarm_open_field/settings.json
  rpc_port: 42471
  ports:
    tcp_base: 4680
    control_local_base: 14840
    control_remote_base: 14980
    px4_instance_base: 0
    px4_system_id_base: 1
    xrce_agent_base: 8888
  camera:
    name: swarm_overhead
    altitude_m: 25
    fov_degrees: 90
    update_hz: 5

validation:
  startup_timeout_s: 15
  smoke_duration_s: 30
