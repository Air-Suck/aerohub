schema_version: 1

deployment:
  # This configuration is the later board-validation stage used by run_robopi.py.
  stage: hybrid_board

fleet:
  vehicle_count: 3
  board_vehicle_index: 0
  coordinator_vehicle_index: 0
  name_prefix: drone
  airsim_name_prefix: Drone
  initial_spacing_m: 4.0

# Launch commands below serve deployment.swarm.orchestrator only. run_robopi.py reads
# fleet, coordination and airsim, runs the board UAV node on RoboPi, and runs the
# task client in the PC ground container.
nodes:
  onboard_computer:
    image: onboard_computer:v0.1.0
    launch_command:
      - bash
      - -lc
      - >-
        docker run --rm --init --network host
        --name aerohub-swarm-{vehicle}
        -e COMPUTE_VEHICLE={vehicle}
        -e AEROHUB_SWARM_CENTER={center_vehicle}
        -v {output}/overlay:/run/aerohub-overlay:ro
        {onboard_computer_image}
        bash -lc 'source /run/aerohub-overlay/install/setup.bash &&
        exec aerohub-swarm-worker --vehicle {vehicle} --center {center_vehicle}'
  board:
    launch_command:
      - bash
      - -lc
      - >-
        ssh "$AEROHUB_BOARD_HOST"
        aerohub-swarm-worker --vehicle {vehicle} --center {center_vehicle}
coordination:
  mode: centralized
  centralized_cases:
    - board_center
    - board_worker

ground_station:
  required: true
  placement: pc
  launch_command:
    - bash
    - -lc
    - >-
      python3 deployment/airsim/demos/swarm_open_field/mission.py

airsim:
  base_settings: ../../../simulator/airsim/scenarios/swarm_open_field/settings.json
  rpc_port: 42471
  ports:
    tcp_base: 4680
    control_local_base: 14840
    control_remote_base: 14980
    px4_instance_base: 40
    px4_system_id_base: 41
    xrce_agent_base: 8901
  camera:
    name: swarm_overhead
    altitude_m: 25
    fov_degrees: 90
    update_hz: 5

validation:
  startup_timeout_s: 30
  smoke_duration_s: 30
