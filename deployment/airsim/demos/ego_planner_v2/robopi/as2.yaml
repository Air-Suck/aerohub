/**:
  ros__parameters:
    use_sim_time: true
    tf_timeout_threshold: 0.1

/**/state_estimator:
  ros__parameters:
    plugin_name: raw_odometry
    raw_odometry:
      use_gps: true
      gps_origin:
        set_origin: first_gps

/**/controller_manager:
  ros__parameters:
    cmd_freq: 50.0
    info_freq: 10.0
    use_bypass: true

/**/TakeoffBehavior:
  ros__parameters:
    takeoff_plugin_name: takeoff_plugin_position

/**/LandBehavior:
  ros__parameters:
    land_plugin_name: land_plugin_speed

/**/GoToBehavior:
  ros__parameters:
    go_to_plugin_name: go_to_plugin_position

/**/FollowPathBehavior:
  ros__parameters:
    follow_path_plugin_name: follow_path_plugin_position
