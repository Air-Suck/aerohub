# 可复用算法能力注册表；路径相对于仓库根目录。
# registered 表示源码已收录；可运行组合以 bindings 为准。
schema_version: 1
environments:
  airsim_px4:
    description: AirSim / PX4 1.18 / AS2；单机平台与 CAT-ORA NH 四机应用通过，其他组合按 binding 状态
    simulator: airsim
    flight_controller: px4
    lifecycle: development
    setup: simulator/airsim/config/README.md
    scene_profiles:
      nh: simulator/airsim/config/nh.json
      town05: simulator/airsim/config/town05.json
      plant: simulator/airsim/config/plant.json
libraries:
  cat_ora:
    name: CAT-ORA
    description: 多机目标分配与轨迹规划；当前接入要求保持任务指定的逐机目标归属
    kind: planner
    status: registered
    manifest: src/tool/navigation/framework/registry/cat_ora/4bc41f593eebde65dd74108a97e80430a145dfa0/manifest.yaml
    implementation:
      adapter: src/tool/navigation/planner/cat_ora/ros2_adapter/bridge
      proxy: src/tool/navigation/planner/cat_ora/ros2_adapter/native/scripts/ros2_proxy.py
      native: src/tool/navigation/planner/cat_ora/ros2_adapter/native
    bindings:
      airsim_px4:
        validation: scenario_pass
        reason: NH 四机 PC、RoboPi 原生执行及三 PC 一 RoboPi 混合部署通过；包含取消与断流悬停验证，未覆盖其他场景或长期稳定性
        application: deployment/airsim/demos/catora_open_field/README.md
        evidence: log/pr-history/deployment/airsim/demos/catora_open_field/hybrid-validation.json
        stability_evidence: log/pr-history/deployment/airsim/demos/catora_open_field/stability-validation.json
    docs: deployment/airsim/libraries.md
    history:
      ref: main
      environment: gazebo_px4_1_17
      validation: historical_pass
      evidence: log/airsim/resolved/FINAL_VERIFICATION.md
      commit: c420169460e59c396f586320e0e06fc96e387f6e
  swarm_formation:
    name: Swarm-Formation
    description: 编队滚动轨迹规划；默认七机，当前真实混合部署验收为三机
    kind: planner
    status: registered
    manifest: src/tool/navigation/framework/registry/swarm_formation/967a4bdfae949e994691f8ffc87dbb0147cbebb7/manifest.yaml
    implementation:
      adapter: src/tool/navigation/planner/swarm_formation/ros2_adapter/bridge
      proxy: src/tool/navigation/planner/swarm_formation/ros2_adapter/native/plan_manage/scripts/ros2_proxy.py
      native: src/tool/navigation/planner/swarm_formation/ros2_adapter/native
    bindings:
      airsim_px4:
        validation: scenario_pass
        reason: NH 三机真实 LiDAR、独立规划/建图/AS2 与两 PC 一 RoboPi 混合飞行通过；未覆盖七机或其他场景
        application: deployment/airsim/demos/swarm_open_field/README.md
        evidence: log/pr-history/deployment/airsim/demos/swarm_open_field/hybrid-validation.json
        point_cloud_validation: real_sensor_map_pass
        point_cloud_evidence: log/pr-history/src/tool/navigation/planner/swarm_formation/validation/real-point-cloud.json
    docs: deployment/airsim/libraries.md
    history:
      ref: main
      environment: gazebo_px4_1_17
      validation: historical_pass
      evidence: log/airsim/resolved/FINAL_VERIFICATION.md
      commit: c420169460e59c396f586320e0e06fc96e387f6e
