/**:
  ros__parameters:
    pid_speed_controller:
      proportional_limitation: true
      use_bypass: true
      position_control:
        reset_integral: false
        antiwindup_cte: 0.5
        alpha: 0.2
        kp: {x: 1.0, y: 1.0, z: 1.0}
        kd: {x: 0.0, y: 0.0, z: 0.0}
        ki: {x: 0.01, y: 0.01, z: 0.01}
      speed_control:
        reset_integral: false
        antiwindup_cte: 1.0
        alpha: 0.3
        kp: {x: 0.0, y: 0.0, z: 0.0}
        kd: {x: 0.0, y: 0.0, z: 0.0}
        ki: {x: 0.0, y: 0.0, z: 0.0}
      speed_in_a_plane_control:
        reset_integral: false
        antiwindup_cte: 1.0
        alpha: 0.3
        height: {kp: 1.0, kd: 0.0, ki: 0.01}
        speed:
          kp: {x: 0.0, y: 0.0}
          kd: {x: 0.0, y: 0.0}
          ki: {x: 0.0, y: 0.0}
      trajectory_control:
        reset_integral: false
        antiwindup_cte: 1.0
        alpha: 0.3
        # External timed trajectories cannot slow their clock to wait for a
        # weak position loop. This velocity-output PID does not add v_ref as
        # feedforward; retain derivative references and tune tracking feedback.
        kp: {x: 1.5, y: 1.5, z: 1.5}
        kd: {x: 0.0001, y: 0.0001, z: 0.0001}
        ki: {x: 0.0, y: 0.0, z: 0.0}
      yaw_control:
        reset_integral: false
        antiwindup_cte: 1.0
        alpha: 0.3
        kp: 1.0
        kd: 0.001
        ki: 0.0
      debug:
        desired_velocity_topic: desired_velocity
