name: uav-aerostack2-cat-ora

services:
  cat-ora:
    build:
      context: ../../..
      dockerfile: libraries/cat_ora/deployment/Dockerfile
    image: uav/aerostack2-cat-ora:noetic
    container_name: aerostack2-cat-ora
    network_mode: host
    environment:
      ROS_MASTER_PORT: "11321"
      ROS_MASTER_URI: http://127.0.0.1:11321
      ROS_IP: 127.0.0.1
    restart: unless-stopped
