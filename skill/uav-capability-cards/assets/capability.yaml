# Capability Card v1 template. Replace example values; keep empty lists explicit.
schema_version: "1.0"
id: navigation/example-tool
version: "0.1.0"
type: tool # capability | tool
name: Example Tool
description: Describe what the complete capability or Tool does.

implementation:
  component_id: example-component
  manifest: deployment/example/component.yaml
  shared_runtime: null
  coupled_capabilities: []

# Data dependencies use exact capability_type matching. Their ROS topic contract is
# defined centrally using assets/capability-types.yaml, not repeated here.
inputs:
  - id: self_pose
    capability_type: state/self/pose/3d

outputs:
  - id: task_status
    capability_type: task/example/status

# Only operation interfaces belong here. Stream data uses inputs and outputs above.
# Runtime topic/service/action names are supplied by deployment or instance data.
interfaces:
  - id: execute
    role: functional_operation # functional_operation | lifecycle_operation
    interaction: managed_task # request_response | managed_task
    protocol: ros2_action # ros2_topic | ros2_service | ros2_action
    schema: aerohub_msgs/action/ExampleTask
    parameter_schema: null

lifecycle:
  management: agent_managed # system_managed | agent_managed | shared_managed
  operations:
    start: null
    status: null
    stop: null

# Hardware requirements are distinct from functional inputs. Type definitions live
# using assets/hardware-types.yaml; actual devices belong to deployment configuration.
hardware_requirements:
  - hardware_type: compute/gpu/cuda

# Logical resource declarations support runtime arbitration. They do not implement it.
resource_access:
  reads:
    - drone/self_state
  shared_writes: []
  exclusive_writes:
    - drone/motion

# Optional. Demo representations never participate in functional dependency matching.
demo:
  representations:
    - id: internal_result
      stage: intermediate # intermediate | final
      description: Describe the representation that is useful to display.
      interface:
        protocol: ros2_topic
        schema: sensor_msgs/msg/PointCloud2
      renderer: point_cloud_3d
